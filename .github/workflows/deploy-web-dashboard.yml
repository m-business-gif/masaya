name: 売上ダッシュボードの公開

on:
  push:
    branches: [claude/inventory-management-system-ENHEm]
    paths:
      - 'web-dashboard/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
