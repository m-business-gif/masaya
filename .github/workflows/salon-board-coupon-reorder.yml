name: サロンボード クーポン自動並び替え

# NOTE: サロンボード(salonboard.com)はGitHub ActionsのようなクラウドのIPからの
# アクセスに応答しない（ボット対策とみられる。診断結果はREADME.md参照）ため、
# 現状ここでの自動実行は成功しない。毎週の自動失敗通知を避けるため schedule
# トリガーは一旦外し、手動実行(workflow_dispatch)のみ残している。
# 将来 self-hosted runner（自宅PC等）を用意した場合はここに schedule を戻すか、
# runs-on を self-hosted に変更して運用する。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true にすると実際の保存を行わず内容確認のみ行う'
        required: false
        default: 'true'

jobs:
  reorder-coupons:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salon-board-coupon-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run coupon reorder
        env:
          SALON_BOARD_LOGIN_ID: ${{ secrets.SALON_BOARD_LOGIN_ID }}
          SALON_BOARD_PASSWORD: ${{ secrets.SALON_BOARD_PASSWORD }}
          # 手動実行(workflow_dispatch)では入力値、定期実行では vars.SALON_BOARD_DRY_RUN
          # (未設定時は安全側の 'true' = 書き込みなし) を使う。
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.SALON_BOARD_DRY_RUN || 'true' }}
          LOOKBACK_DAYS: ${{ vars.SALON_BOARD_LOOKBACK_DAYS || '7' }}
        run: npm run reorder

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: salon-board-error-artifacts
          path: salon-board-coupon-sync/artifacts/
          retention-days: 14
