<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マネジメントポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --ink:#241f22;
    --ink-soft:#5b5257;
    --muted:#8d8184;
    --paper:#fbf7f5;
    --surface:#ffffff;
    --surface-2:#f4eeec;
    --line:#e6dcda;
    --accent:#9c3f56;
    --accent-ink:#ffffff;
    --accent-soft:#f3e2e6;
    --accent-2:#3f7d72;
    --accent-2-soft:#e2ede9;
    --radius:14px;
    --radius-sm:9px;
    --shadow:0 1px 2px rgba(36,31,34,.06), 0 6px 20px -8px rgba(36,31,34,.12);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#f1e9e7; --ink-soft:#cabdb9; --muted:#948885;
      --paper:#181415; --surface:#221c1e; --surface-2:#2a2224;
      --line:#3a2f32; --accent:#e592a5; --accent-ink:#241014;
      --accent-soft:#3a2229; --accent-2:#8bcabd; --accent-2-soft:#1f302c;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 24px -8px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --ink:#f1e9e7; --ink-soft:#cabdb9; --muted:#948885;
    --paper:#181415; --surface:#221c1e; --surface-2:#2a2224;
    --line:#3a2f32; --accent:#e592a5; --accent-ink:#241014;
    --accent-soft:#3a2229; --accent-2:#8bcabd; --accent-2-soft:#1f302c;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 24px -8px rgba(0,0,0,.5);
  }

  *,*::before,*::after{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  h1{font-family:var(--font-display); font-weight:600; margin:0 0 8px; text-wrap:balance;}
  a{color:inherit; text-decoration:none;}

  .shell{max-width:720px; width:100%; margin:0 auto;}
  .eyebrow{
    font-size:.72rem; letter-spacing:.09em; text-transform:uppercase; color:var(--accent);
    font-weight:600; margin-bottom:6px; text-align:center;
  }
  h1{font-size:1.8rem; text-align:center;}
  .lead{color:var(--muted); font-size:.9rem; text-align:center; margin-bottom:32px;}

  .cards{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:600px){.cards{grid-template-columns:1fr;}}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px 22px; box-shadow:var(--shadow); display:flex; flex-direction:column;
    gap:10px; transition:border-color .15s, transform .15s;
  }
  .card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .card .icon{font-size:1.9rem;}
  .card h2{font-family:var(--font-display); font-size:1.15rem; font-weight:600; margin:0;}
  .card p{color:var(--muted); font-size:.85rem; line-height:1.6; margin:0;}
  .card .go{
    margin-top:auto; font-size:.82rem; font-weight:600; color:var(--accent);
    display:inline-flex; align-items:center; gap:4px;
  }
  .card.report{border-top:3px solid var(--accent);}
  .card.dashboard{border-top:3px solid var(--accent-2);}
  .card.dashboard .go{color:var(--accent-2);}
</style>
</head>
<body>

<div class="shell">
  <div class="eyebrow">Personal Management Portal</div>
  <h1>マネジメントポータル</h1>
  <p class="lead">使う画面を選んでください</p>

  <div class="cards">
    <a class="card report" href="report.html">
      <div class="icon">📝</div>
      <h2>業務報告</h2>
      <p>毎日の時間単位ログ・TODO・メモ・アウトプットを記録します。入力は自動保存されます。</p>
      <span class="go">開く →</span>
    </a>
    <a class="card dashboard" href="dashboard.html">
      <div class="icon">📊</div>
      <h2>売上ダッシュボード</h2>
      <p>サロンボードのCSVを取り込んで、店舗・スタッフ・メニュー・稼働率などを分析します。</p>
      <span class="go">開く →</span>
    </a>
  </div>
</div>

</body>
</html>
